<style>
/* Layout: sticky Kopfzeile mit Protokoll-Auswahl und Fortschritt, darunter Abschnitte als aufklappbare Karten, am Ende Mehrkosten, Unterschrift, Export */
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --ink:#14202B; --muted:#5B6B79; --line:#D5DCE4;
  --brand:#1B3A57; --on-brand:#FFFFFF; --accent:#F2B100; --on-accent:#2A2000;
  --warn-bg:#FDECEA; --warn:#B3261E; --ok:#1E7B4B; --field:#F5F7FA;
  --f-head:'Space Grotesk',system-ui,sans-serif; --f-body:'Inter',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E151C; --surface:#17212B; --ink:#E7ECF1; --muted:#97A6B4; --line:#2B3A48;
  --brand:#2D5A87; --on-brand:#FFFFFF; --accent:#F2B100; --on-accent:#2A2000;
  --warn-bg:#3A1C1A; --warn:#FF9C94; --ok:#6FD39B; --field:#101922; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E151C; --surface:#17212B; --ink:#E7ECF1; --muted:#97A6B4; --line:#2B3A48;
  --brand:#2D5A87; --on-brand:#FFFFFF; --accent:#F2B100; --on-accent:#2A2000;
  --warn-bg:#3A1C1A; --warn:#FF9C94; --ok:#6FD39B; --field:#101922; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);
  padding-block:0 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--brand);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--brand);color:var(--on-brand);
  margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px))) calc(-1*max(16px,env(safe-area-inset-right,0px)));
  padding:12px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.hrow{display:flex;align-items:center;gap:10px;justify-content:space-between}
h1{font:700 19px/1.2 var(--f-head);margin:0}
.sub{font-size:12px;opacity:.8}
.pct{font:700 15px var(--f-head);font-variant-numeric:tabular-nums;background:var(--accent);color:var(--on-accent);padding:3px 10px;border-radius:99px}
.bar{height:4px;background:rgba(255,255,255,.25);border-radius:4px;margin-top:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
.tabs{display:flex;gap:6px;margin-top:10px}
.tabs button{flex:1;min-width:0;min-height:40px;padding:0 4px;border-radius:8px;border:1px solid rgba(255,255,255,.4);background:transparent;color:var(--on-brand);font:600 13px var(--f-body);cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
main{display:flex;flex-direction:column;gap:12px;padding-top:14px;max-width:720px;margin:0 auto}
details{background:var(--surface);border:1px solid var(--line);border-radius:12px}
summary{list-style:none;cursor:pointer;padding:14px;display:flex;align-items:center;gap:10px;font:700 16px var(--f-head);min-height:52px}
summary::-webkit-details-marker{display:none}
summary .cnt{margin-left:auto;font:500 12px var(--f-body);color:var(--muted);font-variant-numeric:tabular-nums}
summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-left:4px;transition:transform .15s}
details[open] summary::after{transform:rotate(-135deg)}
summary:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.body{padding:2px 14px 16px;display:grid;grid-template-columns:1fr 1fr;gap:14px 12px}
.field{grid-column:span 2;min-width:0;display:flex;flex-direction:column;gap:5px}
.field.half{grid-column:span 1}
label,.lbl{font-size:13px;font-weight:500;color:var(--muted)}
.hint{font-size:12px;color:var(--muted)}
input[type=text],input[type=number],textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:11px 12px;min-height:46px}
textarea{min-height:84px;resize:vertical}
.unit{position:relative}.unit input{padding-right:44px}.unit span{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--field)}
.seg button{flex:1;min-height:46px;border:0;background:transparent;color:var(--ink);font:500 15px var(--f-body);cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--brand);color:var(--on-brand)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:42px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--field);color:var(--ink);font:500 14px var(--f-body);cursor:pointer}
.chip[aria-pressed=true]{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.warn{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:8px 10px;font-size:13px;font-weight:500}
.chk{grid-column:span 2;display:flex;flex-direction:column;gap:6px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.chk:last-child{border-bottom:0}
.chkrow{display:flex;align-items:flex-start;gap:10px}
.chkrow input{width:22px;height:22px;margin-top:1px;accent-color:var(--brand);flex:none}
.chkrow label{color:var(--ink);font-size:14px;font-weight:400}
.photo{margin-left:32px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 14px var(--f-body);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.btn.primary{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.btn.danger{color:var(--warn)}
.photo .btn{min-height:38px;font-size:13px}
.photo img{width:44px;height:44px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.costs{grid-column:span 2;display:flex;flex-direction:column;gap:6px}
.cost{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:8px 0;border-bottom:1px solid var(--line)}
.cost b{font-variant-numeric:tabular-nums;white-space:nowrap}
.total{display:flex;justify-content:space-between;font:700 17px var(--f-head);padding-top:6px;font-variant-numeric:tabular-nums}
canvas{width:100%;height:150px;background:var(--field);border:1px dashed var(--muted);border-radius:8px;touch-action:none;display:block}
.actions{grid-column:span 2;display:flex;flex-wrap:wrap;gap:10px}
.actions .btn{flex:1 1 140px}
.legal{font-size:12px;color:var(--muted);grid-column:span 2}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

function initSig(cv,clr){
 var r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;cv.width=r.width*dpr;cv.height=r.height*dpr;

 var dn=false,lx=0,ly=0;
 function pos(e){var q=cv.getBoundingClientRect();return[e.clientX-q.left,e.clientY-q.top]}
 cv.addEventListener('pointerdown',function(e){dn=true;var p=pos(e);lx=p[0];ly=p[1];cv.setPointerCapture(e.pointerId);x.beginPath();x.moveTo(lx,ly);x.lineTo(lx+.1,ly+.1);x.stroke();e.preventDefault()});
 cv.addEventListener('pointermove',function(e){if(!dn)return;var p=pos(e);x.beginPath();x.moveTo(lx,ly);x.lineTo(p[0],p[1]);x.stroke();lx=p[0];ly=p[1]});

  return Promise.resolve({save:function(o){return new Promise(function(res,rej){var ok=false;try{ok=window.AndroidBridge.savePdf(b64(o.data),o.filename)}catch(e){}ok?res({status:'saved'}):rej({code:'unavailable'})})}});
 }
